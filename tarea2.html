<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Tarea - Tarea 2</title>
</head>
<body>

    <h2>Formulario para Agregar Tareas - Desarrollador 2</h2>

    <form action="#" method="POST">
        <div>
            <label for="nombre_tarea">Nombre de la tarea:</label><br>
            <input type="text" id="nombre_tarea" name="nombre_tarea" placeholder="Ej. Implementar modulo" required>
        </div>
        <br>
        <div>
            <label for="prioridad">Prioridad:</label><br>
            <select id="prioridad" name="prioridad">
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
            </select>
        </div>
        <br>
        <div>
            <label for="detalles">Detalles adicionales:</label><br>
            <textarea id="detalles" name="detalles" rows="4" placeholder="Escribe los detalles..."></textarea>
        </div>
        <br>
        <button type="submit">Guardar Tarea 2</button>
    </form>

</body>
</html>
